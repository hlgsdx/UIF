name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v261008)'
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            platform: Win32
            toolset: v143
          - arch: x64
            platform: x64
            toolset: v143
          - arch: x86-xp
            platform: Win32
            toolset: v141_xp

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3
        with:
          vs-version: '[17.0,18.0)'

      - name: Install and verify VS 2017 Windows XP toolset
        if: matrix.arch == 'x86-xp'
        shell: pwsh
        timeout-minutes: 20
        run: ./.github/scripts/install-xp-toolset.ps1

      - name: Prepare XP-specific source and projects
        if: matrix.arch == 'x86-xp'
        shell: pwsh
        run: ./.github/scripts/prepare-xp.ps1

      - name: Build Detours and UIF proxies
        shell: pwsh
        env:
          BUILD_ARCH: ${{ matrix.arch }}
          BUILD_PLATFORM: ${{ matrix.platform }}
          BUILD_TOOLSET: ${{ matrix.toolset }}
        run: ./.github/scripts/build.ps1

      - name: Setup Python for XP binary checks
        if: matrix.arch == 'x86-xp'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check XP PE headers and imports
        if: matrix.arch == 'x86-xp'
        shell: pwsh
        run: python .github/scripts/check-xp-pe.py package/x86-xp

      - name: Package binaries
        shell: pwsh
        env:
          BUILD_ARCH: ${{ matrix.arch }}
          BUILD_PLATFORM: ${{ matrix.platform }}
          BUILD_TOOLSET: ${{ matrix.toolset }}
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:GITHUB_WORKSPACE "package\$env:BUILD_ARCH"
          $zip = Join-Path $env:GITHUB_WORKSPACE "dist\UniversalInjectorFramework-$env:RELEASE_TAG-$env:BUILD_ARCH.zip"
          $dlls = @(Get-ChildItem $source -Filter *.dll -File | Sort-Object Name)
          if ($dlls.Count -eq 0) { throw "No DLL files to package in $source" }
          $notes = @(
            'UniversalInjectorFramework binary release',
            "Repository: $env:GITHUB_REPOSITORY",
            "Tag: $env:RELEASE_TAG",
            "Commit: $env:GITHUB_SHA",
            "Architecture: $env:BUILD_ARCH",
            "Platform: $env:BUILD_PLATFORM",
            "MSVC Toolset: $env:BUILD_TOOLSET",
            '',
            'Proxy DLLs:'
          ) + @($dlls | ForEach-Object { '- ' + $_.Name })
          if ($env:BUILD_ARCH -eq 'x86-xp') {
            $notes += @('', 'Target: Windows XP SP3 x86 (NT 5.1)',
              'Validated: PE architecture/subsystem and selected static imports.',
              'NOT YET VERIFIED: actual startup in Windows XP and individual game behavior.',
              'Requires any game-specific legacy DirectX components.')
          }
          $notes | Set-Content -LiteralPath (Join-Path $source 'BUILD_INFO.txt') -Encoding UTF8
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path (Join-Path $source '*') -DestinationPath $zip -CompressionLevel Optimal -Force
          if (-not (Test-Path $zip)) { throw "ZIP not created: $zip" }
          Get-FileHash $zip -Algorithm SHA256 | Format-List

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.arch }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Validate packages and generate SHA256 sums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          for arch in x86 x64 x86-xp; do
            file="UniversalInjectorFramework-${RELEASE_TAG}-${arch}.zip"
            test -s "$file" || { echo "Missing or empty $file"; exit 1; }
          done
          sha256sum \
            "UniversalInjectorFramework-${RELEASE_TAG}-x86.zip" \
            "UniversalInjectorFramework-${RELEASE_TAG}-x64.zip" \
            "UniversalInjectorFramework-${RELEASE_TAG}-x86-xp.zip" \
            > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" dist/*.zip dist/SHA256SUMS.txt --clobber
          else
            gh release create "${RELEASE_TAG}" \
              dist/*.zip dist/SHA256SUMS.txt \
              --target "${GITHUB_SHA}" --title "${RELEASE_TAG}" --generate-notes
          fi
